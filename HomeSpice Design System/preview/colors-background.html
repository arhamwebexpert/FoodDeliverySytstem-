<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .stage { height: 220px; background: var(--cream); background-image: var(--page-gradient); position: relative; display:flex; align-items:flex-end; }
  .cap-bar { background: rgba(255,255,255,0.82); backdrop-filter: blur(4px); width:100%; padding:10px 26px; display:flex; justify-content:space-between; align-items:center; }
  .cap-bar .t { font-size:13px; font-weight:600; color:var(--ink-800); }
  .cap-bar .h { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--gray-450); }
</style></head>
<body><div class="card">
  <div class="stage">
    <div class="cap-bar">
      <span class="t">Page background — warm cream + coral/peach radial blobs</span>
      <span class="h">#fdf8f4 + 5 radial-gradients</span>
    </div>
  </div>
</div></body></html>
