<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .radii { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; }
  .r { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:72px; height:72px; background:#fff; border:2px solid var(--coral-500); }
  .pill { width:96px; height:44px; }
  .nm { font-size:11px; font-weight:600; color:var(--ink-800); }
  .vl { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--gray-400); }
</style></head>
<body><div class="card">
  <div class="radii">
    <div class="r"><div class="box" style="border-radius:4px"></div><div class="nm">xs</div><div class="vl">4px</div></div>
    <div class="r"><div class="box" style="border-radius:8px"></div><div class="nm">sm</div><div class="vl">8px</div></div>
    <div class="r"><div class="box" style="border-radius:12px"></div><div class="nm">md</div><div class="vl">12px</div></div>
    <div class="r"><div class="box" style="border-radius:18px"></div><div class="nm">lg</div><div class="vl">18px</div></div>
    <div class="r"><div class="box pill" style="border-radius:50px"></div><div class="nm">pill</div><div class="vl">50px</div></div>
    <div class="r"><div class="box" style="border-radius:50%"></div><div class="nm">full</div><div class="vl">50%</div></div>
  </div>
  <div class="cap" style="margin-top:14px">Buttons &amp; inputs use 4px · cards/modals 8px · food cards 18px · CTAs, counters &amp; badges are full pills · menu thumbs are circles.</div>
</div></body></html>
