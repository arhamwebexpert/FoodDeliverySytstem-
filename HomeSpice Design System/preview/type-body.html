<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .spec { display:flex; flex-direction:column; gap:11px; }
  .line { display:flex; align-items:baseline; gap:16px; }
  .meta { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--gray-400); width:130px; flex-shrink:0; }
  .food-name { font-size:18px; font-weight:600; color:var(--ink-900); }
  .body { font-size:16px; font-weight:400; color:var(--gray-500); }
  .small { font-size:14px; font-weight:400; color:var(--gray-450); }
  .desc { font-size:12px; font-weight:400; color:var(--gray-400); }
  .price { font-size:22px; font-weight:800; color:var(--tomato); }
</style></head>
<body><div class="card">
  <div class="spec">
    <div class="line"><span class="meta">22 / 800 · tomato</span><span class="price">$24</span></div>
    <div class="line"><span class="meta">18 / 600</span><span class="food-name">Chicken Salad</span></div>
    <div class="line"><span class="meta">16 / 400</span><span class="body">Browse a diverse menu of dishes crafted with the finest ingredients.</span></div>
    <div class="line"><span class="meta">14 / 400</span><span class="small">Already have an account? Login here</span></div>
    <div class="line"><span class="meta">12 / 400 · gray</span><span class="desc">Food provides essential nutrients for overall health and well-being</span></div>
  </div>
</div></body></html>
