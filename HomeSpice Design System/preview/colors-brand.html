<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-card); }
  .sw .chip { height: 64px; }
  .sw .meta { padding: 7px 9px; background: #fff; }
  .sw .name { font-size: 12px; font-weight: 600; color: var(--ink-800); }
  .sw .hex { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--gray-400); }
</style></head>
<body><div class="card">
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#ff8a8a"></div><div class="meta"><div class="name">coral-300</div><div class="hex">#ff8a8a</div></div></div>
    <div class="sw"><div class="chip" style="background:#ff7a7a"></div><div class="meta"><div class="name">coral-400</div><div class="hex">#ff7a7a</div></div></div>
    <div class="sw"><div class="chip" style="background:#ff6b6b;position:relative"><span style="position:absolute;top:6px;right:8px;font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:20px">PRIMARY</span></div><div class="meta"><div class="name">coral-500</div><div class="hex">#ff6b6b</div></div></div>
    <div class="sw"><div class="chip" style="background:#ff5252"></div><div class="meta"><div class="name">coral-600</div><div class="hex">#ff5252</div></div></div>
    <div class="sw"><div class="chip" style="background:#ff3333"></div><div class="meta"><div class="name">coral-700</div><div class="hex">#ff3333</div></div></div>
  </div>
  <div class="row" style="margin-top:14px">
    <div class="sw" style="flex:1"><div class="chip" style="background:#ff6347"></div><div class="meta"><div class="name">tomato — accent (prices, rating, active ring)</div><div class="hex">#ff6347</div></div></div>
    <div class="sw" style="flex:1"><div class="chip" style="background:#ffe6e6"></div><div class="meta"><div class="name">tomato-soft — tinted surface</div><div class="hex">#ffe6e6</div></div></div>
  </div>
</div></body></html>
