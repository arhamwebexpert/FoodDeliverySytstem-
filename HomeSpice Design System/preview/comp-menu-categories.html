<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .list { display:flex; gap:26px; align-items:center; justify-content:center; }
  .item { text-align:center; }
  .item img { width:88px; height:88px; border-radius:50%; object-fit:cover; cursor:pointer; transition:.2s; }
  .item img.active { border:4px solid var(--tomato); padding:2px; }
  .item p { margin-top:10px; color:var(--gray-450); font-size:16px; }
</style></head>
<body><div class="card">
  <div class="list">
    <div class="item"><img class="active" src="../assets/menu/menu_1.png"><p>Salads</p></div>
    <div class="item"><img src="../assets/menu/menu_2.png"><p>Rolls</p></div>
    <div class="item"><img src="../assets/menu/menu_3.png"><p>Deserts</p></div>
    <div class="item"><img src="../assets/menu/menu_4.png"><p>Sandwiches</p></div>
    <div class="item"><img src="../assets/menu/menu_6.png"><p>Vegetarian</p></div>
    <div class="item"><img src="../assets/menu/menu_7.png"><p>Pastas</p></div>
  </div>
  <div class="cap" style="margin-top:8px;text-align:center">Circular category thumbs. Selected gets a tomato ring; hover shrinks to scale(0.8).</div>
</div></body></html>
