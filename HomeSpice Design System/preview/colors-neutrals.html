<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: 9px; overflow: hidden; box-shadow: var(--shadow-card); }
  .sw .chip { height: 52px; }
  .sw .meta { padding: 6px 8px; background: #fff; }
  .sw .name { font-size: 11px; font-weight: 600; color: var(--ink-800); }
  .sw .hex { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--gray-400); }
</style></head>
<body><div class="card">
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#1a1a1a"></div><div class="meta"><div class="name">ink-900</div><div class="hex">#1a1a1a</div></div></div>
    <div class="sw"><div class="chip" style="background:#262626"></div><div class="meta"><div class="name">ink-800</div><div class="hex">#262626</div></div></div>
    <div class="sw"><div class="chip" style="background:#323232"></div><div class="meta"><div class="name">ink-700</div><div class="hex">#323232</div></div></div>
    <div class="sw"><div class="chip" style="background:#666"></div><div class="meta"><div class="name">gray-500</div><div class="hex">#666666</div></div></div>
    <div class="sw"><div class="chip" style="background:#888"></div><div class="meta"><div class="name">gray-400</div><div class="hex">#888888</div></div></div>
    <div class="sw"><div class="chip" style="background:#c9c9c9"></div><div class="meta"><div class="name">gray-300</div><div class="hex">#c9c9c9</div></div></div>
    <div class="sw"><div class="chip" style="background:#e2e2e2"></div><div class="meta"><div class="name">gray-200</div><div class="hex">#e2e2e2</div></div></div>
    <div class="sw"><div class="chip" style="background:#eee"></div><div class="meta"><div class="name">gray-150</div><div class="hex">#eeeeee</div></div></div>
    <div class="sw"><div class="chip" style="background:#f8f9fa"></div><div class="meta"><div class="name">surface-50</div><div class="hex">#f8f9fa</div></div></div>
    <div class="sw"><div class="chip" style="background:#fdf8f4"></div><div class="meta"><div class="name">cream</div><div class="hex">#fdf8f4</div></div></div>
    <div class="sw"><div class="chip" style="background:#fff;border:1px solid #eee"></div><div class="meta"><div class="name">white</div><div class="hex">#ffffff</div></div></div>
    <div class="sw"><div class="chip" style="background:#747474"></div><div class="meta"><div class="name">gray-450</div><div class="hex">#747474</div></div></div>
  </div>
</div></body></html>
