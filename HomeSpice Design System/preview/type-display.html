<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .spec { display:flex; flex-direction:column; gap:14px; }
  .line { display:flex; align-items:baseline; gap:16px; }
  .meta { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--gray-400); width:120px; flex-shrink:0; }
  .hero { font-size:48px; font-weight:500; color:var(--ink-900); letter-spacing:-0.02em; line-height:1; }
  .h1 { font-size:34px; font-weight:500; color:var(--ink-800); }
  .h2 { font-size:30px; font-weight:600; color:var(--ink-600); }
</style></head>
<body><div class="card">
  <div class="spec">
    <div class="line"><span class="meta">56 / 500</span><span class="hero">Order your favourite food</span></div>
    <div class="line"><span class="meta">34 / 500</span><span class="h1">Explore our menu</span></div>
    <div class="line"><span class="meta">30 / 600</span><span class="h2">Place your order</span></div>
  </div>
  <div class="cap" style="margin-top:16px">Poppins — display weights run light-to-medium (300–600). Headlines stay airy; weight is reserved for prices &amp; CTAs.</div>
</div></body></html>
